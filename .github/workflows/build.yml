name: Build and Test Shyne Creator

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Test and build both loaders
        shell: pwsh
        run: .\gradlew.bat clean releaseBundle --stacktrace

      - name: Upload Fabric, NeoForge and checksums
        uses: actions/upload-artifact@v6
        with:
          name: shyne-creator-${{ github.sha }}
          path: build/releases/*
          if-no-files-found: error
