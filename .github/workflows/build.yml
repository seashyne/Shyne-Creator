name: Build and Test Shyne Creator

on:
  pull_request:
  push:
    branches: [main, 'mc/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Test and build both loaders
        shell: pwsh
        run: .\gradlew.bat clean releaseBundle --stacktrace

      - name: Read mod version
        id: mod_version
        shell: pwsh
        run: |
          $line = Get-Content gradle.properties | Where-Object { $_ -match '^mod_version=' } | Select-Object -First 1
          if (-not $line) { throw 'mod_version is missing from gradle.properties' }
          "value=$($line.Substring('mod_version='.Length))" >> $env:GITHUB_OUTPUT

      - name: Upload Fabric, NeoForge and checksums
        uses: actions/upload-artifact@v6
        with:
          name: shyne-creator-${{ steps.mod_version.outputs.value }}
          path: build/releases/*
          if-no-files-found: error
