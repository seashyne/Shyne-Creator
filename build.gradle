plugins {
    id 'base'
}

group = mod_group
version = mod_version

tasks.register('verifyLoaderParity') {
    group = 'verification'
    description = 'Checks that common code is loader-neutral and both loader adapters expose the same protocol/version.'
    doLast {
        def commonJava = fileTree('common/src/main/java') { include '**/*.java' }.files
        def forbiddenImports = commonJava.findAll { file ->
            def text = file.getText('UTF-8')
            text.contains('net.fabricmc') || text.contains('net.neoforged')
        }
        if (!forbiddenImports.empty) {
            throw new GradleException("Loader imports are not allowed in common: ${forbiddenImports}")
        }

        def relativeJavaPaths = { String root ->
            def rootDir = file(root)
            fileTree(rootDir) { include '**/*.java' }.files.collect {
                rootDir.toPath().relativize(it.toPath()).toString().replace('\\', '/')
            } as Set
        }
        def fabricAdapters = relativeJavaPaths('fabric/src/main/java')
        def neoForgeAdapters = relativeJavaPaths('neoforge/src/main/java')
        if (fabricAdapters != neoForgeAdapters) {
            throw new GradleException(
                "Loader adapter paths differ. Fabric-only=${fabricAdapters - neoForgeAdapters}, " +
                "NeoForge-only=${neoForgeAdapters - fabricAdapters}"
            )
        }

        def valueFrom = { File source, String pattern ->
            def match = source.getText('UTF-8') =~ pattern
            if (!match.find()) {
                throw new GradleException("Could not read parity value from ${source}")
            }
            match.group(1)
        }
        def fabricCore = file('fabric/src/main/java/seashyne/shynecore/ShyneCore.java')
        def neoForgeCore = file('neoforge/src/main/java/seashyne/shynecore/ShyneCore.java')
        def fabricNetwork = file('fabric/src/main/java/seashyne/shynecore/network/ShyneNetwork.java')
        def neoForgeNetwork = file('neoforge/src/main/java/seashyne/shynecore/network/ShyneNetwork.java')
        def fabricVersion = valueFrom(fabricCore, /VERSION\s*=\s*"([^"]+)"/)
        def neoForgeVersion = valueFrom(neoForgeCore, /VERSION\s*=\s*"([^"]+)"/)
        def fabricProtocol = valueFrom(fabricNetwork, /PROTOCOL_VERSION\s*=\s*(\d+)/)
        def neoForgeProtocol = valueFrom(neoForgeNetwork, /PROTOCOL_VERSION\s*=\s*(\d+)/)
        if (fabricVersion != neoForgeVersion || fabricVersion != project.mod_version) {
            throw new GradleException(
                "Runtime versions differ: Fabric=${fabricVersion}, NeoForge=${neoForgeVersion}, Gradle=${project.mod_version}"
            )
        }
        if (fabricProtocol != neoForgeProtocol) {
            throw new GradleException(
                "Network protocols differ: Fabric=${fabricProtocol}, NeoForge=${neoForgeProtocol}"
            )
        }
    }
}

tasks.register('verifyReleaseMetadata') {
    group = 'verification'
    description = 'Checks that release version and protocol references match the runtime.'
    dependsOn 'verifyLoaderParity'
    doLast {
        def expectedVersion = project.mod_version.toString()
        def versionFiles = [
            file('VERSION.txt'),
            file('README.md'),
            file('docs-site/src/content.ts'),
            file('tools/kit/README_INSTALL_TH.md')
        ]
        def staleVersionFiles = versionFiles.findAll { source ->
            !source.exists() || !source.getText('UTF-8').contains(expectedVersion)
        }
        if (!staleVersionFiles.empty) {
            throw new GradleException(
                "Release version ${expectedVersion} is missing from: ${staleVersionFiles}"
            )
        }

        def networkSource = file('fabric/src/main/java/seashyne/shynecore/network/ShyneNetwork.java')
        def protocolMatch = networkSource.getText('UTF-8') =~ /PROTOCOL_VERSION\s*=\s*(\d+)/
        if (!protocolMatch.find()) {
            throw new GradleException("Could not read protocol version from ${networkSource}")
        }
        def expectedProtocol = protocolMatch.group(1)
        def protocolDocs = [file('README.md'), file('MULTIPLAYER_TESTING.md')]
        def staleProtocolFiles = protocolDocs.findAll { source ->
            !source.getText('UTF-8').contains("protocol `${expectedProtocol}`") &&
                !source.getText('UTF-8').contains("Protocol ปัจจุบันคือ ${expectedProtocol}")
        }
        if (!staleProtocolFiles.empty) {
            throw new GradleException(
                "Network protocol ${expectedProtocol} is missing from: ${staleProtocolFiles}"
            )
        }
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Builds and verifies the Fabric and NeoForge distributions.'
    dependsOn 'verifyReleaseMetadata', ':fabric:build', ':neoforge:build'
}

tasks.register('collectReleaseJars', Sync) {
    group = 'distribution'
    description = 'Builds both loaders and stages only the current release JARs in build/releases.'
    dependsOn buildAll
    from(project(':fabric').layout.buildDirectory.dir('libs')) {
        include '*.jar'
        exclude '*-sources.jar'
    }
    from(project(':neoforge').layout.buildDirectory.dir('libs')) {
        include '*.jar'
        exclude '*-sources.jar'
    }
    into layout.buildDirectory.dir('releases')
}

tasks.register('writeReleaseChecksums') {
    group = 'distribution'
    description = 'Writes SHA-256 checksums for the staged Fabric and NeoForge JARs.'
    dependsOn 'collectReleaseJars'
    def releaseDirectory = layout.buildDirectory.dir('releases')
    inputs.files(provider {
        fileTree(releaseDirectory) { include '*.jar' }
    })
    outputs.file(releaseDirectory.map { it.file('SHA256SUMS.txt') })
    doLast {
        def directory = releaseDirectory.get().asFile
        def jars = fileTree(directory) { include '*.jar' }.files.sort { it.name }
        if (jars.size() != 2) {
            throw new GradleException("Expected exactly two release JARs, found ${jars*.name}")
        }
        def lines = jars.collect { jar ->
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            jar.withInputStream { input ->
                byte[] buffer = new byte[8192]
                int read
                while ((read = input.read(buffer)) != -1) {
                    digest.update(buffer, 0, read)
                }
            }
            "${digest.digest().encodeHex()}  ${jar.name}"
        }
        new File(directory, 'SHA256SUMS.txt').setText(
            lines.join(System.lineSeparator()) + System.lineSeparator(),
            'UTF-8'
        )
    }
}

tasks.register('releaseBundle') {
    group = 'distribution'
    description = 'Builds, verifies, stages and checksums a two-loader release.'
    dependsOn 'writeReleaseChecksums'
}

tasks.named('build') {
    dependsOn buildAll
}
